<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Player - System Dashboard</title>
    <style>
        :root {
            --device-bg: #e0e0e0;
            --screen-bg: #fdfdfd;
            --accent-blue: #3498db;
            --terminal-green: #00ff41;
            --terminal-bg: #0d0d0d;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #92cbfa; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        /* --- IPOD CLASSIC CSS INTERFACE --- */
        .top-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            width: 90%;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .ipod-body {
            background: var(--device-bg);
            width: 500px;
            height: 280px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.8), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #bbb;
            margin-bottom: 0;
        }

        .screen {
            background: var(--screen-bg);
            width: 240px;
            height: 180px;
            border-radius: 10px;
            border: 3px solid #666;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            color: #333;
        }

        #song-title {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
        }

        .controls-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .click-wheel {
            width: 170px;
            height: 170px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-btn {
            position: absolute;
            background: none;
            border: none;
            color: #888;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .wheel-btn:hover { color: var(--accent-blue); }
        .btn-top { top: 10px; font-size: larger;}
        .btn-bottom { bottom: 10px; font-size: larger;}
        .btn-left { left: 10px; }
        .btn-right { right: 10px; }

        .center-button {
            width: 60px;
            height: 60px;
            background: #eee;
            border-radius: 50%;
            border: 1px solid #ccc;
            cursor: pointer;

            display: flex;              /* ADD THIS */
            justify-content: center;    /* horizontal */
            align-items: center;        /* vertical */
        }

        .progress-container { margin-top: auto; }
        #progressBar { width: 100%; accent-color: var(--accent-blue); }
        .time-info { display: flex; justify-content: space-between; font-size: 11px; color: #666; }

        .dashboard {
            width: 90%;
            height: 500px;
            background: var(--terminal-bg);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .dashboard-title {
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        #logic-feed {
            height: 480px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 30px;
            line-height: 1.5;
        }

        .log-entry { margin-bottom: 30px; }
        .log-bus { color: #f1c40f; } /* Yellow for Bus/Signal */
        .log-proc { color: var(--terminal-green); font-weight: bold; } /* Green for CPU */
        .log-ram { color: #9b59b6; } /* Purple for RAM */

        /* --- AUDIO RING BUFFER VISUALIZATION --- */
        .buffer-container {
            width: 870px;
            background: var(--terminal-bg);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .buffer-title {
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: var(--terminal-green);
        }

        .buffer-slots {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .buffer-slot {
            width: 60px;
            height: 60px;
            border: 2px solid #444;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            font-size: 11px;
            color: #666;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .buffer-slot.filled {
            background: #2d5a2d;
            border-color: var(--terminal-green);
            color: var(--terminal-green);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .buffer-info {
            font-size: 12px;
            color: #888;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>

    <div class="top-row">
        <div class="ipod-body">
            <div class="screen">
                <div style="width: 60px; height: 60px; background: #ddd; margin-bottom: 10px;"></div>
                <div id="song-title">Select Track...</div>
                
                <div class="progress-container">
                    <input type="range" id="progressBar" min="0" max="100" value="0" onchange="seekAudio(this.value)">
                    <div class="time-info">
                        <span id="time-current">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>
            </div>

        <div class="controls-container">
            <div class="click-wheel">
                <button class="wheel-btn btn-top" onclick="changeVolume(10)">+</button>
                <button class="wheel-btn btn-bottom" onclick="changeVolume(-10)">-</button>
                <button class="wheel-btn btn-left" onclick="sendCommand('prev')">⏮</button>
                <button class="wheel-btn btn-right" onclick="sendCommand('next')">⏭</button>
                <div class="center-button" id="playPauseBtn" onclick="togglePlay()">▶ ||</div>
            </div>
        </div>
    </div>

    <div class="buffer-container">
        <div class="buffer-title">Audio Ring Buffer Status (10 Slots)</div>
        <div class="buffer-slots" id="bufferSlots">
            <!-- Buffer slots will be generated by JavaScript -->
        </div>
        <div class="buffer-info">
            <span id="buffer-count">Filled: 0/10</span> | 
            <span id="buffer-status">Ready</span>
        </div>
    </div>

    <div class="dashboard">
        <div class="dashboard-title">
            <span>System Architecture Monitor</span>
            <span style="color: var(--terminal-green)">● BUS ACTIVE</span>
        </div>
        <div id="logic-feed">
            <div class="log-entry">Waiting for interrupt...</div>
        </div>
    </div>

    <script>
        // System State Simulation
        let currentVolume = 50;
        let isDragging = false;
        let isPlaying = false; // Track playing state
        const logicFeed = document.getElementById('logic-feed');

        /**
         * Initialize buffer slots
         */
        function initializeBufferSlots() {
            const bufferContainer = document.getElementById('bufferSlots');
            for (let i = 0; i < 10; i++) {
                const slot = document.createElement('div');
                slot.className = 'buffer-slot';
                slot.id = `buffer-slot-${i}`;
                slot.innerText = i;
                bufferContainer.appendChild(slot);
            }
        }

        /**
         * Update buffer visualization
         */
        function updateBufferDisplay(bufferItems) {
            const filledCount = bufferItems.length;
            for (let i = 0; i < 10; i++) {
                const slot = document.getElementById(`buffer-slot-${i}`);
                if (i < filledCount) {
                    const itemText = bufferItems[i];
                    const displayText = itemText.length > 8 ? itemText.slice(0, 8) + '…' : itemText;
                    slot.classList.add('filled');
                    slot.innerText = displayText;
                    slot.title = itemText;
                } else {
                    slot.classList.remove('filled');
                    slot.innerText = i;
                    slot.title = '';
                }
            }
            document.getElementById('buffer-count').innerText = `Filled: ${filledCount}/10`;
            
            if (filledCount === 10) {
                document.getElementById('buffer-status').innerText = '⚠ BUFFER FULL';
            } else if (filledCount > 0) {
                document.getElementById('buffer-status').innerText = '✓ Buffering';
            } else {
                document.getElementById('buffer-status').innerText = 'Ready';
            }
        }

        /**
         * Helper to convert milliseconds to MM:SS format
         */
        function formatTime(ms) {
            if (!ms || ms < 0) return '0:00';
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        /**
         * Helper to simulate the System Dashboard Log
         * Types: bus (yellow), proc (green), ram (purple)
         */
        function addLog(message, type = 'bus') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString().split(' ')[0];
            
            let typeClass = 'log-bus';
            if (type === 'proc') typeClass = 'log-proc';
            if (type === 'ram') typeClass = 'log-ram';

            entry.innerHTML = `<span style="color: #666">[${timestamp}]</span> <span class="${typeClass}">${message}</span>`;
            logicFeed.prepend(entry); // Newest logs at the top
        }

        function updateSongTitle() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    if (data.current_song && data.current_song !== 'No Media') {
                        document.getElementById('song-title').innerText = data.current_song;
                    }
                    const btn = document.getElementById('playPauseBtn');
                    isPlaying = data.is_playing; // Update global state

                    if (!isDragging && data.pos >= 0) {
                        document.getElementById('progressBar').value = data.pos * 100;
                    }
                });
        }

        /**
         * 1. INTERRUPT TRIGGER (The 'Electrical' Signal)
         */
        function sendCommand(action, payload = null) {
            const label = (action === 'play') ? (isPlaying ? 'play' : 'pause') : action.toUpperCase();
            addLog(`INTERRUPT: ${label} sent to CPU`, 'bus');
            
            let formData = new FormData();
            if (payload !== null) {
                // Mapping UI names to Flask expected names
                const key = action === 'volume' ? 'level' : 'pos';
                formData.append(key, payload);
            }

            // Map 'prev' and 'next' to the backend routes
            const route = `/${action}`;

            fetch(route, { method: 'POST', body: (payload !== null ? formData : null) })
                .then(res => res.json())
                .then(data => {
                    const ackLabel = (action === 'play') ? (isPlaying ? 'play' : 'pause') : action.toUpperCase();
                    addLog(`CPU: acknowledged I/O request ${ackLabel}`, 'proc');
                    if (['play', 'next', 'prev'].includes(action)) updateSongTitle();
                })
                .catch(err => addLog(`ERROR: Bus timeout or Hardware failure`, 'proc'));
        }

        /**
         * 2. UI SPECIFIC HANDLERS
         */
        function togglePlay() {
            const label = isPlaying ? 'pause' : 'play';
            sendCommand('play', null, label);
        }

        function changeVolume(delta) {
            currentVolume = Math.min(100, Math.max(0, currentVolume + delta));
            addLog(`VOLUME CHANGE: volume set to ${currentVolume}%`);
            sendCommand('volume', currentVolume);
        }

        function seekAudio(value) {
            // Map 0-100 UI scale to 0.0-1.0 hardware scale
            const pos = value / 100;
            addLog(`SEEK: Moving laser head to offset ${pos}`, 'ram');
            sendCommand('seek', pos);
        }

        // Track when user is dragging the progress bar
        const progressBar = document.getElementById('progressBar');
        progressBar.addEventListener('mousedown', () => { isDragging = true; });
        progressBar.addEventListener('mouseup', () => { isDragging = false; });
        progressBar.addEventListener('touchstart', () => { isDragging = true; });
        progressBar.addEventListener('touchend', () => { isDragging = false; });

        /**
         * 3. TELEMETRY POLLING (Updating the LCD Screen)
         */
        setInterval(() => {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    // Update Progress Bar
                    const progBar = document.getElementById('progressBar');
                    if (!isDragging) {
                        progBar.value = data.pos * 100;
                    }

                    // Update Song Title
                    const title = document.getElementById('song-title');
                    if (data.current_song !== "No Media") {
                        title.innerText = data.current_song;
                    }
                });

            // Fetch time data from /progress endpoint
            fetch('/progress')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('time-current').innerText = formatTime(data.current);
                    document.getElementById('time-total').innerText = formatTime(data.total);
                });

            // Fetch buffer status
            fetch('/buffer-status')
                .then(res => res.json())
                .then(data => {
                    updateBufferDisplay(data.items);
                });
        }, 1000);

        // Initial log
        addLog("SYSTEM: Kernel initialized. DMA Buffers clear.", "proc");

        // Initialize buffer slots
        initializeBufferSlots();
        updateBufferDisplay([]);
    </script>
</body>
</html>
